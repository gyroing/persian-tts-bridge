[package]
name = "speak"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
phonon = []

[[bin]]
name = "speak"
path = "src/main.rs"
required-features = ["phonon"]

[dependencies]
persian_normalizer = { path = "../persian_normalizer" }
tokenizer = { path = "../tokenizer" }
serde_json = "1"
